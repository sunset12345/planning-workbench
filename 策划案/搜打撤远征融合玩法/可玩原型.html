.route-value-hint{position:absolute;left:813px;top:499px;width:245px;height:22px;line-height:22px;text-align:center;font-size:15px;color:#923b34;pointer-events:none}

.custom-editor .custom-item.is-carried{border-color:#a88140;background:#f0e7ce;box-shadow:inset 0 0 0 2px #cba666}

/* Empty preset slots are fixed, while custom slots remain available to edit. */
.scheme .kit .kit-lock-slot{display:flex;align-items:center;justify-content:center;width:48px;height:48px;margin:0 auto 2px;border:1px solid #98a6a5;border-radius:6px;background:#cbd2cc;color:#758580;box-shadow:inset 0 1px 3px #40546120}.scheme .kit-lock-slot .hud-icon{width:24px;height:24px}

/* The exit confirmation uses a full-screen input mask below a fixed-size panel. */
#exploration-exit-mask{display:none}
#modal[data-layout="confirmation"][open]{position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;box-shadow:none;overflow:hidden}
#modal[data-layout="confirmation"]::backdrop{background:transparent}
#modal[data-layout="confirmation"] #exploration-exit-mask{display:block;position:absolute;inset:0;background:#000000c8;z-index:0;pointer-events:auto}
#modal[data-layout="confirmation"] #dialog-content{position:absolute;left:var(--exit-center-x,50vw);top:var(--exit-center-y,50vh);width:600px;height:400px;max-width:none;max-height:none;padding:26px;border:2px solid #8aa4a9;background:#f3f9f7;color:#243d45;box-shadow:0 24px 90px #0005;transform:translate(-50%,-50%) scale(var(--exit-modal-scale,1));transform-origin:center;display:flex;flex-direction:column;z-index:1}
#modal[data-layout="confirmation"] .dialog-close{position:absolute;right:26px;top:26px;margin:0}

.yield .resource-pill>.resource-value.insufficient{color:#e34e45}
#modal[data-kind="manual-energy"] h2{padding-right:0}

#modal[data-kind="manual-energy"] .energy-refill-confirm .art{width:80px;height:80px;margin:0}

.battle-bg{background-size:cover;background-position:center;opacity:.55}.battle-sky-patch{display:none}

.battle-energy{width:400px}.battle-energy .energy-pill{height:41px;padding:4px 9px;flex:none}.battle-energy .energy-pill .art{width:27px;height:27px}

/* 整组从游戏画布外侧滑入，入场时始终裁切在 game-frame 内。 */
.map-tip{position:absolute;bottom:0;z-index:24;width:403px;height:255px;box-sizing:border-box;color:#000;pointer-events:none}
.map-tip[data-placement=left]{left:0;animation:corner-tip-from-left 360ms cubic-bezier(.2,.8,.2,1) both}
.map-tip[data-placement=right]{right:0;animation:corner-tip-from-right 360ms cubic-bezier(.2,.8,.2,1) both}
.map-tip.is-exiting[data-placement=left]{animation:corner-tip-to-left 360ms cubic-bezier(.8,0,.8,.2) both}
.map-tip.is-exiting[data-placement=right]{animation:corner-tip-to-right 360ms cubic-bezier(.8,0,.8,.2) both}
@keyframes corner-tip-from-left{from{transform:translateX(-403px)}to{transform:translateX(0)}}
@keyframes corner-tip-from-right{from{transform:translateX(403px)}to{transform:translateX(0)}}
@keyframes corner-tip-to-left{from{transform:translateX(0)}to{transform:translateX(-403px)}}
@keyframes corner-tip-to-right{from{transform:translateX(0)}to{transform:translateX(403px)}}
@media (prefers-reduced-motion:reduce){.map-tip[data-placement]{animation:none}}
.map-tip-portrait{position:absolute;bottom:0;width:255px;height:255px;box-sizing:border-box;background:#fff;border:1px solid #000}
.map-tip-message{position:absolute;top:0;width:255px;height:77px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px 14px;background:#9a8f70;border:1px solid #0a0a0a;text-align:center}
.map-tip[data-placement=left] .map-tip-portrait{left:0}.map-tip[data-placement=left] .map-tip-message{left:148px}
.map-tip[data-placement=right] .map-tip-portrait{right:0}.map-tip[data-placement=right] .map-tip-message{left:0}
.map-tip-label{display:block;width:100%;font-size:20px;font-weight:400;line-height:28px}.map-tip.has-detail .map-tip-label{font-size:18px;line-height:24px}.map-tip-detail{display:block;width:100%;font-size:12px;line-height:16px}

<script>
(function(root){
  'use strict';
  const clone=value=>JSON.parse(JSON.stringify(value));
  const KEY='expedition-fusion-runtime-v1';
  function create(config,seed,storage,options={}){
    const tables=clone(config.tables),indexes=Object.fromEntries(Object.entries(tables).map(([name,rows])=>[name,Object.fromEntries(rows.map(row=>[row.id??row.mapId,row]))]));
    const mode=tables.Const[0],now=options.now||Date.now,random=options.random||Math.random;
    const uid=()=>options.uid?options.uid():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
    let state,error='',persisted=!!storage;
    const inventorySeed=()=>Object.fromEntries((seed.inventory||[]).map(x=>[x.itemId,x.count]));
    const initial=()=>({version:1,revision:0,screen:'map',account:{balance:seed.balance,stamina:seed.stamina,staminaMax:seed.staminaMax,inventory:inventorySeed(),collection:{},newTypes:[],unlocked:clone(seed.difficultyUnlocks),custom:clone(seed.customPlans||{})},run:null,result:null,settled:[]});
    try{const saved=storage?.getItem(KEY);state=saved?JSON.parse(saved):initial();if(state.version!==1)throw Error('存档版本不兼容');}catch(e){state=initial();error='存档读取失败：'+e.message;}
    function save(){state.revision++;try{storage?.setItem(KEY,JSON.stringify(state));persisted=!!storage;}catch(e){persisted=false;error='无法保存本地存档：'+e.message;}return state;}
    function weighted(pool,exclude=new Set()){
      const allowed=Object.entries(pool).filter(([id,weight])=>!exclude.has(id)&&weight>0);if(!allowed.length)throw Error('候选配置不足');
      let value=Math.min(.999999999,Math.max(0,random()))*allowed.reduce((n,[,weight])=>n+weight,0);
      for(const [id,weight] of allowed){value-=weight;if(value<0)return id;}return allowed.at(-1)[0];
    }

    const item=id=>indexes.Item[id];
    function normalizeCustomEquipment(){let changed=false;for(const [id,plan] of Object.entries(state.account.custom||{})){if(!Array.isArray(plan))continue;let remaining=mode.equipmentCarryMax;const limited=[];for(const entry of plan){if(item(entry.itemId)?.category!=='Equipment'){limited.push(entry);continue;}const count=Math.min(entry.count,remaining);remaining-=count;if(count>0)limited.push({...entry,count});if(count!==entry.count)changed=true;}state.account.custom[id]=limited;}if(changed)save();}
    normalizeCustomEquipment();
    const loot=id=>({...clone(item(id)),uid:uid()});
    const bagValue=bag=>(bag||[]).reduce((n,x)=>n+(x?.value||0),0);
    const total=()=>state.run?bagValue(state.run.normal)+bagValue(state.run.gold):0;
    const active=id=>{const map=indexes.Map[id];if(!map?.visible||map.enabled===false)return false;if(!map.startTime&&!map.endTime)return true;if(!map.startTime||!map.endTime)return false;const a=Date.parse(map.startTime),b=Date.parse(map.endTime);return Number.isFinite(a)&&Number.isFinite(b)&&now()>=a&&now()<b;};
    const difficulty=(mapId,value)=>indexes.Map[mapId]?.difficulties.find(x=>x.difficulty===value);
    const collectionTiers=mapId=>indexes.Map[mapId]?.collectionTiers||[];
    const stages=r=>indexes.Map[r.mapId].treasureStages.filter(x=>x.difficulty===r.difficulty).sort((a,b)=>a.stage-b.stage);
    function group(id,kind){const g=indexes.ChallengeGroup[id];if(!g)throw Error('整关配置不存在：'+id);return {kind,groupId:id,rooms:clone(g.roomIds),name:g.name};}
    function drawTreasure(r,index,extra=[]){const row=stages(r)[index];return row?{...group(weighted(row.candidates,new Set([...r.completed,...extra])),'treasure'),stage:index,dropId:row.dropId}:null;}
    function collectionStats(mapId){const types=tables.TreasureType.filter(t=>!mapId||t.mapId===mapId);return {stars:types.reduce((n,t)=>n+(state.account.collection[t.id]?.stars||0),0),value:types.reduce((n,t)=>n+(state.account.collection[t.id]?.value||0),0)};}
    function collectionGrowth(){return tables.Map.reduce((sum,map)=>sum+collectionTiers(map.id).filter(t=>t.starSumRequired<=collectionStats(map.id).stars).reduce((n,t)=>n+t.growthValue,0),0);}
    function quote(mapId,difficulty,plan){
      const md=indexes.Map[mapId]?.difficulties.find(x=>x.difficulty===difficulty);if(!md)throw Error('地图难度配置不存在');
      let price=0,fullPrice=0;const seen=new Set(),totals={},stock=[];
      const limits={Equipment:mode.equipmentCarryMax,EnergyPotion:mode.potionCarryMax,MagicCard:mode.cardCarryMax,GoldenPack:mode.goldCarryMax};
      for(const entry of plan){const it=item(entry.itemId);if(!it||!Object.hasOwn(limits,it.category)||seen.has(it.id)||!Number.isInteger(entry.count)||entry.count<1)throw Error('战备方案不合法');seen.add(it.id);
        totals[it.category]=(totals[it.category]||0)+entry.count;if(!Number.isInteger(limits[it.category])||totals[it.category]>limits[it.category])throw Error('战备数量超过上限');
        const available=Math.max(0,state.account.inventory[it.id]||0),used=Math.min(available,entry.count),buy=entry.count-used;price+=buy*it.buyPrice;fullPrice+=entry.count*it.buyPrice;stock.push({itemId:it.id,count:entry.count,available,used,buy});
      }return {price,fullPrice,stamina:md.staminaCost,threshold:md.exitValue,stock};
    }
    function restoreResultScreen(){if(!state.result)return false;const screen=state.result.success?'success':'failure';if(state.screen===screen)return false;state.screen=screen;save();return true;}
    function pendingSettlement(){restoreResultScreen();return {ok:false,message:'请先确认当前结算',pendingResult:true};}
    function buy(mapId,difficulty,plan){
      if(!active(mapId))return {ok:false,message:'地图已关闭'};
      if(state.run&&!state.run.settled)return {ok:false,message:'已有未结束探索，请继续或结束旧局'};
      if(state.result)return pendingSettlement();
      const q=quote(mapId,difficulty,plan);
      if(state.account.balance<q.price)return {ok:false,message:'代币不足',price:q.price};
      if(q.price===0)return {ok:true,price:0};
      state.account.balance-=q.price;
      for(const row of q.stock)if(row.buy)state.account.inventory[row.itemId]=(state.account.inventory[row.itemId]||0)+row.buy;
      save();return {ok:true,price:q.price};
    }
    function settle(success,reason){
      const r=state.run;if(!r||r.settled||state.settled.includes(r.id))return false;
      const carried=clone((success?[...r.normal,...r.gold]:r.gold).filter(Boolean)),lost=clone(success?[]:r.normal.filter(Boolean));
      const gain=carried.reduce((n,x)=>n+x.value,0);state.account.balance+=gain;
      for(const it of carried){const prev=state.account.collection[it.typeId];if(!prev||it.stars>prev.stars){state.account.collection[it.typeId]=clone(it);if(!state.account.newTypes.includes(it.typeId))state.account.newTypes.push(it.typeId);}}
      if(success&&r.bossDefeated&&r.difficulty<3){const list=state.account.unlocked[r.mapId]||(state.account.unlocked[r.mapId]=[1]);if(!list.includes(r.difficulty+1))list.push(r.difficulty+1);}
      r.settled=true;state.settled.push(r.id);state.result={runId:r.id,success,reason,mapId:r.mapId,difficulty:r.difficulty,carried,lost,value:gain,collectionGrowth:collectionGrowth(),gold:clone(r.gold),normal:clone(r.normal)};
      state.screen=success?'success':'failure';r.scene=state.screen;r.energyPrompt=null;r.pending=null;r.replacement=null;save();return true;
    }
    function checkAvailability(){if(state.run&&!state.run.settled&&!active(state.run.mapId)){settle(false,'closed');return true;}return false;}
    function interrupt(){const r=state.run;if(!r?.challenge)return;r.challenge=null;r.roomIndex=0;r.energyPrompt=null;if(r.lastKind==='boss')r.bossEscaped=true;r.scene='routes';}
    // Older previews treated an uncompleted abyss as an already reached safe zone.
    // Preserve real return arrivals (lastKind=return), resources and all account data.
    if(state.run&&!state.run.settled&&state.run.scene==='exit'&&state.run.abyssState==='available'&&['boss','abyss'].includes(state.run.lastKind)){
      state.run.scene='routes';if(state.screen==='exit')state.screen='routes';save();
    }
    if(state.run&&!state.run.settled&&state.run.challenge&&['battle','retry','bag'].includes(state.screen)){interrupt();state.screen='map';save();}
    if(state.screen==='bag'){state.screen=state.run?.settled?state.run.scene:state.run?.scene||'map';save();}
    if(['prepare','custom'].includes(state.screen)&&!state.run)state.screen='map';
    restoreResultScreen();
    checkAvailability();
    function begin(challenge){const r=state.run;r.challenge=clone(challenge);r.lastKind=challenge.kind;r.roomIndex=0;r.scene='battle';state.screen='battle';}
    function promptEnergy(continuation){const r=state.run;if(r.energy>0)return false;if(r.potion.count>0){r.energyPrompt=continuation;save();return true;}settle(false,'energy');return true;}
    function start(mapId,difficulty,plan,requireOwned=false){
      if(state.run&&!state.run.settled)return {ok:false,message:'已有未结束探索，请继续或结束旧局'};
      if(state.result)return pendingSettlement();
      if(!active(mapId))return {ok:false,message:'地图已关闭'};
      if(!(state.account.unlocked[mapId]||[1]).includes(difficulty))return {ok:false,message:'通关前一难度BOSS并成功撤离后解锁'};
      let q;try{q=quote(mapId,difficulty,plan);}catch(e){return {ok:false,message:e.message};}
      if(requireOwned&&q.price>0)return {ok:false,message:'请先购买套装缺少的战备物资'};
      if(state.account.stamina<q.stamina)return {ok:false,message:'体力不足'};
      if(state.account.balance<q.price)return {ok:false,message:'代币不足'};
      // Resolve all candidates before atomically committing inventory/stamina/currency.
      const r={id:uid(),mapId,difficulty,energy:mode.initialEnergy,maxEnergy:mode.maxEnergy,threshold:q.threshold,normal:Array(mode.normalSlots).fill(null),gold:[],plan:clone(plan),potion:{itemId:null,count:0},potions:[],card:{itemId:null,count:0},cards:[],equipmentBonusTotal:0,collectionSnapshot:collectionGrowth(),completed:[],stageIndex:0,provided:null,nextGroup:null,bossGroup:null,bossDefeated:false,bossEscaped:false,abyssJudged:false,abyssGroup:null,abyssState:'none',returnSegment:null,returnGrowth:0,challenge:null,lastKind:'treasure',roomIndex:0,scene:'battle',pending:null,rewardContext:null,replacement:null,energyPrompt:null,settled:false};
      for(const e of plan){const it=item(e.itemId);if(it.category==='Equipment')r.equipmentBonusTotal+=it.equipmentBonus*e.count;if(it.category==='EnergyPotion')r.potions.push({itemId:it.id,count:e.count});if(it.category==='MagicCard')r.cards.push({itemId:it.id,count:e.count});if(it.category==='GoldenPack')r.gold.push(...Array(e.count).fill(null));}
      r.potion={itemId:r.potions[0]?.itemId||null,count:r.potions.reduce((n,p)=>n+p.count,0)};
      r.card={itemId:r.cards[0]?.itemId||null,count:r.cards.reduce((n,c)=>n+c.count,0)};
      try{r.provided=drawTreasure(r,0);if(!r.provided)throw Error('未配置首档宝物组');}catch(e){return {ok:false,message:e.message};}
      for(const e of q.stock)state.account.inventory[e.itemId]=(state.account.inventory[e.itemId]||0)-e.used;
      state.account.stamina-=q.stamina;state.account.balance-=q.price;state.run=r;begin(r.provided);save();return {ok:true};
    }
    function depart(kind){const r=state.run;if(!r||r.settled)return {ok:false,message:'没有可继续的探索'};
      if(checkAvailability())return {ok:false,message:'地图已关闭'};
      if(r.energyPrompt)return {ok:false,message:'请先处理补能提示'};
      if(!['routes','exit'].includes(r.scene))return {ok:false,message:'请先完成当前奖励或挑战'};
      const safe=r.scene==='exit';
      if(kind==='return'){
        if(safe)return {ok:false,message:'已经抵达安全区'};
        if(total()<r.threshold)return {ok:false,message:'宝物价值不足'};
        if(!r.returnSegment){const def=indexes.Map[r.mapId],count=def.initialTotalRooms+r.returnGrowth,used=new Set(),rooms=[];
          try{for(let i=0;i<count-1;i++){const id=weighted(def.returnNormalCandidates,used);used.add(id);rooms.push(id);}rooms.push(weighted(def.returnBossCandidates));}catch(e){return {ok:false,message:e.message};}
          r.returnSegment={kind:'return',groupId:uid(),rooms,name:'提前返程'};
        }
        if(promptEnergy({kind:'departure',target:kind}))return {ok:true};begin(r.returnSegment);
      }else{
        if(safe&&r.energy<=0)return {ok:false,message:'请先手动补充能量再继续'};
        if(promptEnergy({kind:'departure',target:kind}))return {ok:true};
        if(kind==='treasure'){if(!r.provided)return {ok:false,message:'宝物关已完成'};begin(r.provided);}
        else if(kind==='boss'){if(r.bossDefeated)return {ok:false,message:'探索BOSS已完成'};if(!r.bossGroup)r.bossGroup=group(weighted(indexes.Map[r.mapId].bossCandidates),'boss');begin(r.bossGroup);}
        else if(kind==='abyss'){if(r.abyssState!=='available'||!r.abyssGroup)return {ok:false,message:'没有可挑战深渊'};begin(r.abyssGroup);}
        else return {ok:false,message:'未知挑战'};
      }save();return {ok:true};
    }
    function safeZone(){const r=state.run;r.scene='exit';state.screen='exit';r.challenge=null;r.roomIndex=0;if(r.bossDefeated&&!r.provided&&r.abyssState!=='available'&&total()<r.threshold)settle(false,'lost');}
    function win(){const r=state.run;if(r?.scene!=='battle'||!r.challenge||r.energyPrompt)return {ok:false,message:'当前不能通关'};
      if(r.roomIndex<r.challenge.rooms.length-1){r.roomIndex++;if(r.energy<=0)promptEnergy({kind:'next-room'});save();return {ok:true};}
      const c=clone(r.challenge);r.challenge=null;r.roomIndex=0;
      if(c.kind==='return'){r.returnSegment=null;safeZone();save();return {ok:true};}
      if(c.kind==='treasure')r.nextGroup=drawTreasure(r,c.stage+1,[c.groupId]);
      if(c.kind==='boss'){r.bossDefeated=true;if(!r.abyssJudged){r.abyssJudged=true;const def=indexes.Map[r.mapId];if(random()<def.abyssChance){r.abyssGroup=group(weighted(def.abyssCandidates),'abyss');r.abyssState='available';}else r.abyssState='none';}}
      if(c.kind==='abyss')r.abyssState='completed';
      r.rewardContext=c;r.scene='chest';state.screen='chest';save();return {ok:true};
    }
    function act(outcome){const r=state.run;if(r?.scene!=='battle'||r.energyPrompt)return {ok:false,message:'当前不能行动'};if(promptEnergy({kind:'next-room'}))return {ok:true};
      r.energy=Math.max(0,r.energy-(seed.simulationActionCost||1));
      if(outcome==='win')return win();
      if(outcome==='lose'){r.scene='retry';state.screen='retry';if(r.energy<=0)promptEnergy({kind:'retry'});}
      else if(r.energy<=0)promptEnergy({kind:'next-room'});
      save();return {ok:true};
    }
    function usePotion(confirm=false){const r=state.run;if(!r||r.settled||r.potion.count<1)return {ok:false,message:'药水余量为0'};if(r.energyPrompt&&!confirm)return {ok:false,message:'请确认补能'};
      const active=r.potions?.find(p=>p.count>0);if(active){active.count--;r.potion.itemId=r.potions.find(p=>p.count>0)?.itemId||active.itemId;}
      r.potion.count--;r.energy+=item(active?.itemId||r.potion.itemId).energyRestore;const continuation=r.energyPrompt;r.energyPrompt=null;save();
      if(continuation?.kind==='departure')return depart(continuation.target);return {ok:true};
    }
    function openChest(){const r=state.run;if(r?.scene!=='chest')return {ok:false,message:'没有待开启宝箱'};
      const c=r.rewardContext,drop=c.kind==='treasure'?indexes.DropPool[c.dropId]:tables.DropPool.find(d=>d.mapId===r.mapId&&d.difficulty===r.difficulty&&d.purpose===c.kind);
      if(!drop)return {ok:false,message:'掉落配置缺失'};r.pending=loot(weighted(drop.candidates));r.scene='reward';state.screen='reward';save();return {ok:true};
    }
    function finishReward(){const r=state.run,c=r.rewardContext;r.pending=null;r.replacement=null;r.rewardContext=null;
      if(c.kind==='treasure'){if(!r.completed.includes(c.groupId)){r.completed.push(c.groupId);r.returnGrowth+=indexes.Map[r.mapId].roomsPerTreasureGroup;}r.stageIndex=c.stage+1;r.provided=r.nextGroup;r.nextGroup=null;r.scene='routes';state.screen='routes';}
      else if(c.kind==='boss'&&r.abyssState==='available'){r.scene='routes';state.screen='routes';}
      else {r.returnSegment=null;safeZone();}save();
    }
    function collect(target=null){const r=state.run;if(r?.scene!=='reward'||!r.pending)return {ok:false,message:'没有待领取宝物'};
      const gi=r.gold.indexOf(null),ni=r.normal.indexOf(null),priority=r.pending.quality>mode.autoGoldQuality||r.pending.value>mode.autoGoldValue;
      if(target){if(!['normal','gold'].includes(target.container)||!Number.isInteger(target.index)||!r[target.container][target.index])return {ok:false,message:'替换对象不存在'};r[target.container][target.index]=clone(r.pending);}
      else if(gi>=0&&(priority||ni<0))r.gold[gi]=clone(r.pending);
      else if(ni>=0)r.normal[ni]=clone(r.pending);
      else {save();return {ok:true,replaceRequired:true};}
      finishReward();return {ok:true};
    }
    function discard(){const r=state.run;if(!r?.pending||r.normal.includes(null)||r.gold.includes(null))return {ok:false,message:'当前不是满包奖励选择'};finishReward();return {ok:true};}
    function move(from,to){sync();if(checkAvailability())return false;const r=state.run;if(!r||r.settled||!['normal','gold'].includes(from.container)||!['normal','gold'].includes(to.container))return false;
      const a=r[from.container],b=r[to.container];if(!Number.isInteger(from.index)||!Number.isInteger(to.index)||from.index<0||to.index<0||from.index>=a.length||to.index>=b.length||!a[from.index])return false;[a[from.index],b[to.index]]=[b[to.index],a[from.index]];save();return true;}
    function pause(){if(!state.run||state.run.settled)return {ok:false,message:'没有旧局'};if(state.run.challenge)interrupt();state.screen='map';save();return {ok:true};}
    function resume(){if(!state.run||state.run.settled)return {ok:false,message:'没有旧局'};if(checkAvailability())return {ok:false,message:'地图已关闭'};state.screen=state.run.scene;save();return {ok:true};}
    function exitChallenge(){if(!state.run?.challenge)return {ok:false,message:'没有当前挑战'};interrupt();state.screen=state.run.scene;save();return {ok:true};}
    function retry(){const r=state.run;if(r?.scene!=='retry')return {ok:false,message:'当前不在战败重打节点'};r.scene='battle';state.screen='battle';save();return {ok:true};}
    function magic(){const r=state.run;if(r?.scene!=='battle'||r.energyPrompt||r.card.count<1)return {ok:false,message:'当前没有可使用的技能卡'};const active=r.cards?.find(c=>c.count>0),usedId=active?.itemId||r.card.itemId;if(active){active.count--;r.card.itemId=r.cards.find(c=>c.count>0)?.itemId||active.itemId;}r.card.count--;save();return {ok:true,itemId:usedId,effect:item(usedId).spellEffect};}
    function extract(){const r=state.run;if(r?.scene!=='exit'||r.settled)return {ok:false,message:'尚未抵达安全区'};if(total()<r.threshold)return {ok:false,message:'宝物价值不足'};settle(true,'extract');return {ok:true};}

<script>
const REFERENCE_IMAGES=[];
window.PROTOTYPE_RULE_SOURCE={"title":"“搜打撤/远征”融合玩法","testOnly":true,"configurationSha256":"709aa4433af739f09d2ed0a4e7168aacd51e7cd0eab01e090330d4c3cee40456"};

// 游戏画布底角 Tips。调用 show 时只需提供文案、类型和触发事件；可在其他界面复用。
function createCornerTips({frame, host, escapeHtml, holdMs = 2000}) {
  let timer;
  function clear(immediate = false) {
    clearTimeout(timer);
    const tip = host.querySelector('.map-tip');
    if (!tip) return;
    if (immediate || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      tip.remove();
      return;
    }
    if (tip.classList.contains('is-exiting')) return;
    tip.classList.add('is-exiting');
    tip.addEventListener('animationend', event => {
      if (event.target === tip) tip.remove();
    }, {once: true});
  }
  function placementFor(event) {
    const bounds = frame.getBoundingClientRect();
