<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#f3f6f0"/><rect width="960" height="70" fill="#234a3b"/><text x="35" y="46" font-size="26" fill="white">UI-04 通用提示与确认状态 · 线框示意</text><rect x="35" y="95" width="890" height="320" rx="12" fill="white" stroke="#dce4db"/><text x="65" y="140" font-size="24" fill="#234339">原因提示</text><text x="65" y="192" font-size="24" fill="#234339">{name}不足，需要{count}{unit}</text><text x="65" y="244" font-size="24" fill="#234339">明确失败：未消耗资源</text><text x="65" y="296" font-size="24" fill="#234339">结果不明：确认中，不声明未扣费</text><g><rect x="65" y="450" width="240" height="56" rx="9" fill="#27614f"/><text x="90" y="486" font-size="23" fill="white">确认</text></g><text x="35" y="540" font-size="15" fill="#718476">静态信息与状态示意；不代表最终视觉规范。</text></svg>