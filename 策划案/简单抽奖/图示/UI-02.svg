<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#f3f6f0"></rect><rect width="960" height="70" fill="#234a3b"></rect><text x="35" y="46" font-size="26" fill="white">UI-02 奖池概率弹窗 · 线框示意</text><rect x="35" y="95" width="890" height="320" rx="12" fill="white" stroke="#dce4db"></rect><text x="65" y="140" font-size="24" fill="#234339">概率行：entries[0..N-1]</text><text x="65" y="192" font-size="24" fill="#234339">名称_i × count_i                 display(p_i)</text><text x="65" y="244" font-size="24" fill="#234339">p_i = weight_i / Σweight</text><text x="65" y="296" font-size="24" fill="#234339">固定6行可视；超出滚动</text><text x="65" y="348" font-size="24" fill="#234339">一次只返回一条结果；各次独立</text><g><rect x="65" y="450" width="240" height="56" rx="9" fill="#27614f"></rect><text x="90" y="486" font-size="23" fill="white">关闭</text></g><text x="35" y="540" font-size="15" fill="#718476">静态信息与状态示意；不代表最终视觉规范。</text></svg>